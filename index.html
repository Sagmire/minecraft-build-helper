<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minecraft Build Helper</title>
  <meta name="description" content="Learn Minecraft building tricks, find block palettes, save inspiration and plan your builds.">
  <meta name="theme-color" content="#4f7f2c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon-192.png" alt="" width="32" height="32">
      <span>Build Helper</span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <button type="button" class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">⚙️</button>
  </header>

  <main>
    <section id="tab-learn" class="tab" hidden></section>
    <section id="tab-palettes" class="tab" hidden></section>
    <section id="tab-inspiration" class="tab" hidden></section>
    <section id="tab-planner" class="tab" hidden></section>
    <section id="tab-checklist" class="tab" hidden></section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="tipDialog" aria-label="Tip"></dialog>
  <dialog id="photoDialog" class="wide" aria-label="Photo"></dialog>
  <dialog id="settingsDialog" aria-label="Settings"></dialog>
  <dialog id="setupDialog" aria-label="Setup"></dialog>
  <div id="tour" class="tour" hidden>
    <div id="tourSpot" class="tour-spot"></div>
    <div id="tourTip" class="tour-tip" role="dialog" aria-live="polite" aria-labelledby="tourTitle"></div>
  </div>

  <script src="blocks.js"></script>
  <script src="tips-data.js"></script>
  <script src="images.js"></script>
  <script src="tips.js"></script>
  <script src="palettes.js"></script>
  <script src="inspiration.js"></script>
  <script src="view3d.js"></script>
  <script src="planner.js"></script>
  <script src="block-planner.js"></script>
  <script src="checklist.js"></script>
  <script src="setup.js"></script>
  <script src="tour.js"></script>
  <script src="app.js"></script>
</body>
</html>
